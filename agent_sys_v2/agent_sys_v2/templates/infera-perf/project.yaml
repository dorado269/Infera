title: Infera 性能优化
description: 端到端性能 campaign：基线、诊断、实验、开发、评审 5 个类型；机器互斥、验收检查、结果台账和 Infera 性能 skills
goal: ""               # 一句话目标，显示在看板顶部，例如：AgentX C64 的 tok/s/GPU 提升 20%，P90 interactivity ≥ 30
machines: []           # 可用的节点，同一台同时只给一个任务：- {name: <主机名>, gpus: 8, note: MI355X}
ledger:                # 结果台账：任务写在 results/ 下的 infera.result 文件
  primary: tok_s_gpu   # 主指标（metrics 里的键）
  higher_is_better: true
skills: [infera-deploy, infera-bench, infera-quality-gate, infera-diagnose, infera-experiment, infera-hygiene]
autorun: true          # 上游完成后自动启动下游；关掉则所有任务都要手动点"开始"
max_running: 3         # 本项目同时运行的任务数（后台等待和终端接管的任务也计入）
lanes: [baseline, diagnose, experiment, develop, review]
agent:                 # 任务默认值，新建任务时可改
  model: opus
  effort: high
  budget_usd: 200
  extra_args: []       # 任意额外的 claude CLI 参数，原样透传
